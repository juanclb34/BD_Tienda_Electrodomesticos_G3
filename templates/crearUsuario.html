{% extends "base.html" %}

{% block content %}

<h2>Crear Usuario</h2>

<form method="POST" action="/crearUsuario">

    <label>Rol:</label>
    <select name="rol" required>
        {% for r in roles %}
            <option value="{{ r[0] }}">{{ r[1] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Nombre:</label>
    <input name="nombre" required><br><br>

    <label>Apellido 1:</label>
    <input name="apellido1" required><br><br>

    <label>Apellido 2:</label>
    <input name="apellido2" required><br><br>

    <label>Correo:</label>
    <input name="correo" type="email" required><br><br>

    <label>Telefono:</label>
    <input name="telefono" required><br><br>

    <label>Direccion:</label>
    <input name="direccion" required><br><br>

    <label>Password:</label>
    <input name="password" type="password" required><br><br>

    <button type="submit">Crear</button>

</form>

<br>

<a href="/usuarios">Volver</a>

{% endblock %}
