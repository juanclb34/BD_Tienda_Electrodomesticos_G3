{% extends "base.html" %}

{% block content %}

<h2>Crear Producto</h2>

<form method="POST" action="/crearProducto">

    <label>Nombre:</label>
    <input name="nombre" required><br><br>

    <label>Modelo:</label>
    <input name="modelo"><br><br>

    <label>Descripción:</label>
    <input name="descripcion"><br><br>

    <label>Marca:</label>
    <select name="marca" required>
        {% for m in marcas %}
            <option value="{{ m[0] }}">{{ m[1] }}</option>
        {% endfor %}
    </select>
    <br><br>

    <label>Categoría:</label>
    <select name="categoria" required>
        {% for c in categorias %}
            <option value="{{ c[0] }}">{{ c[1] }}</option>
        {% endfor %}
    </select>
    <br><br>

    <hr>

    <h3>Inventario</h3>

    <label>Proveedor:</label>
    <select name="proveedor" required>
        {% for p in proveedores %}
            <option value="{{ p[0] }}">{{ p[1] }}</option>
        {% endfor %}
    </select><br><br>

    <label>Cantidad:</label>
    <input type="number" name="cantidad" required><br><br>

    <label>Cantidad mínima:</label>
    <input type="number" name="minimo" required><br><br>

    <label>Costo:</label>
    <input type="number" step="0.01" name="costo" required><br><br>

    <button type="submit">Crear Producto</button>

</form>

<br>
<a href="/productos">Volver</a>

{% endblock %}
